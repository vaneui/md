name: Test

on:
  push:
    branches-ignore:
      - main
      - prod
  pull_request:

permissions:
  contents: read

# A new push to a branch or pull request replaces the run for the previous one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Tests
        run: npm test
        env:
          CI: true

      - name: Build Package
        run: npm run build

      - name: Verify Package Contents
        run: npm pack --dry-run

      # Same check the publish workflows run, so a broken exports map or type
      # resolution fails the pull request instead of the release.
      - name: Validate Package Exports and Types
        run: npm run check:package

name: Publish Alpha Release to npm

# Run on pushes to the main branch
on:
  push:
    branches:
      - main

permissions:
  contents: read

# One alpha publish at a time, in push order, so `alpha` never ends up on the older of
# two quick pushes. A run in progress is never cancelled mid-publish; GitHub keeps only
# the newest waiting run.
concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write — npm trusted publishing (OIDC), no NPM_TOKEN needed
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Tests
        run: npm test
        env:
          CI: true

      - name: Check Test Results
        if: failure()
        run: |
          echo "❌ Tests failed! Cannot proceed with alpha publication."
          echo "Please fix the failing tests before merging to main branch."
          exit 1

      # Generate pre-release version with timestamp and commit SHA
      - name: Generate Alpha Version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # A pre-release of a version that is already on npm would sort below it
          # (1.3.0-alpha.x < 1.3.0), so builds made after a stable release are
          # pre-releases of the next patch.
          if [ -n "$(npm view "$PACKAGE_NAME@$BASE_VERSION" version 2>/dev/null || true)" ]; then
            BASE_VERSION=$(node -p "const [major, minor, patch] = process.argv[1].split('.').map(Number); [major, minor, patch + 1].join('.')" "$BASE_VERSION")
          fi
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          # The `g` prefix keeps the identifier valid: an all-digit short SHA with a
          # leading zero is not a legal semver pre-release identifier.
          SHORT_SHA="g$(git rev-parse --short HEAD)"
          ALPHA_VERSION="${BASE_VERSION}-alpha.${TIMESTAMP}.${SHORT_SHA}"
          echo "Alpha version: $ALPHA_VERSION"
          echo "version=$ALPHA_VERSION" >> $GITHUB_OUTPUT
          # Update package.json with alpha version
          npm version $ALPHA_VERSION --no-git-tag-version

      - name: Build Package
        run: npm run build

      - name: Run Tests on Built Package
        run: npm test
        env:
          CI: true

      - name: Check Build and Test Results
        if: failure()
        run: |
          echo "❌ Build or post-build tests failed!"
          echo "Cannot proceed with alpha publication."
          exit 1

      # Verify what will be in the package before publishing
      - name: Verify Package Contents
        run: npm pack --dry-run

      # The exports map targets must exist (publint) and the shipped types must resolve
      # under every TypeScript moduleResolution mode (attw). Both tools are pinned
      # devDependencies: this job holds the npm publish token.
      - name: Validate Package Exports and Types
        run: npm run check:package

      - name: Publish Alpha to npm
        run: npm publish --access public --tag alpha

      - name: Report Success
        run: |
          echo "✅ Alpha release published successfully!"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🏷️  Tag: alpha"
          echo "📥 Install with: npm install @vaneui/md@alpha"